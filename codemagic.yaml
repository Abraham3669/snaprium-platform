workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - app_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.snaprium.app
      vars:
        BUNDLE_ID: com.snaprium.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6814171428
      node: v22
      xcode: 26.6          # ← change this (or use "latest")
    scripts:
      # ... rest of your scripts stay the same ...
      - name: Install dependencies
        script: npm ci

      - name: Build web
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Enable push notifications (entitlement + AppDelegate)
        script: |
          set -e
          ENT="ios/App/App/App.entitlements"
          [ -f "$ENT" ] || ENT=$(find ios/App -name "*.entitlements" | head -1)
          echo "Entitlements file: $ENT"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT"

          python3 - <<'PY'
          import re
          path = "ios/App/App/AppDelegate.swift"
          src = open(path).read()
          if "didRegisterForRemoteNotificationsWithDeviceToken" in src:
              print("AppDelegate already forwards push tokens")
          else:
              add = (
                  "    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n"
                  "    }\n\n"
                  "    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n"
                  "    }\n\n"
              )
              m = re.search(r"^[ \t]*func application\(", src, re.M)
              if m:
                  src = src[:m.start()] + add + src[m.start():]
              else:
                  i = src.rstrip().rfind("}")
                  src = src[:i] + "\n" + add + src[i:]
              open(path, "w").write(src)
              print("Added push token forwarding to AppDelegate")
          PY
          grep -n "RemoteNotifications" ios/App/App/AppDelegate.swift

      - name: Set up keychain
        script: keychain initialize

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Link entitlements file to the app target (push)
        script: |
          set -e
          python3 - <<'PY'
          import glob, os, re
          proj = "ios/App/App.xcodeproj/project.pbxproj"
          cands = [e for e in sorted(glob.glob("ios/App/**/*.entitlements", recursive=True)) if "/Pods/" not in e]
          ent = next((e for e in cands if e.endswith("App/App.entitlements")), cands[0] if cands else None)
          if not ent:
              raise SystemExit("No .entitlements file found under ios/App")
          rel = os.path.relpath(ent, "ios/App")
          src = open(proj).read()
          def fix(m):
              block = m.group(0)
              if not re.search(r'PRODUCT_BUNDLE_IDENTIFIER = "?com\.snaprium\.app"?;', block):
                  return block
              if "CODE_SIGN_ENTITLEMENTS" in block:
                  return re.sub(r'CODE_SIGN_ENTITLEMENTS = [^;]*;', 'CODE_SIGN_ENTITLEMENTS = "%s";' % rel, block)
              return block.replace("buildSettings = {", 'buildSettings = {\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = "%s";' % rel, 1)
          new = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", fix, src, flags=re.S)
          open(proj, "w").write(new)
          print("Entitlements file used:", rel)
          PY
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj

      - name: Show signing profile (push check)
        script: |
          for p in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "== $p"
            security cms -D -i "$p" | plutil -p - | grep -E '"Name"|aps-environment|application-identifier' || true
          done

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || \
                                app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          echo "New build number: $(($LATEST_BUILD_NUMBER + 1))"

      - name: Build IPA
        script: |
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa" \
            --archive-flags="-destination 'generic/platform=iOS'"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=========== XCODEBUILD ERRORS ==========="
            grep -h -B2 -A8 -E "error:|Provisioning profile|entitlement" /tmp/xcodebuild_logs/*.log 2>/dev/null | head -120
            echo "=========================================="
          fi
          exit $STATUS

      - name: Verify push is inside the built app
        script: |
          IPA=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -type f | head -1)
          echo "IPA: $IPA"
          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
          unzip -q "$IPA" -d /tmp/ipa_check
          APP=$(ls -d /tmp/ipa_check/Payload/*.app | head -1)
          echo "== Entitlements the signed app really carries"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee /tmp/ent.txt
          echo "== Entitlements inside the provisioning profile"
          security cms -D -i "$APP/embedded.mobileprovision" | plutil -p - | grep -E 'aps-environment|"Name"' || true
          if ! grep -q "aps-environment" /tmp/ent.txt; then
            echo "!!! PUSH IS MISSING from this build (no aps-environment in the signed app)."
            echo "!!! Check: Push Notifications is ticked on the App ID in Apple Developer, the profile was re-created after that and re-uploaded to Codemagic."
            exit 1
          fi
          echo "OK: push entitlement is present in the signed app."

      - name: Find IPA (debug)
        script: |
          echo "Looking for IPA files..."
          find "$CM_BUILD_DIR" -name "*.ipa" -type f || true
          ls -la "$CM_BUILD_DIR/build/ios/ipa/" || true

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false