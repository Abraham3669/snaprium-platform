workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - app_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.snaprium.app
      vars:
        BUNDLE_ID: com.snaprium.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6814171428
      node: v22
      xcode: 26.6          # ← change this (or use "latest")
    scripts:
      # ... rest of your scripts stay the same ...
      - name: Install dependencies
        script: npm ci

      - name: Build web
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Enable push notifications (entitlement + AppDelegate)
        script: |
          set -e
          ENT="ios/App/App/App.entitlements"
          [ -f "$ENT" ] || ENT=$(find ios/App -name "*.entitlements" | head -1)
          echo "Entitlements file: $ENT"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT"

          python3 - <<'PY'
          import re
          path = "ios/App/App/AppDelegate.swift"
          src = open(path).read()
          if "didRegisterForRemoteNotificationsWithDeviceToken" in src:
              print("AppDelegate already forwards push tokens")
          else:
              add = (
                  "    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n"
                  "    }\n\n"
                  "    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n"
                  "    }\n\n"
              )
              m = re.search(r"^[ \t]*func application\(", src, re.M)
              if m:
                  src = src[:m.start()] + add + src[m.start():]
              else:
                  i = src.rstrip().rfind("}")
                  src = src[:i] + "\n" + add + src[i:]
              open(path, "w").write(src)
              print("Added push token forwarding to AppDelegate")
          PY
          grep -n "RemoteNotifications" ios/App/App/AppDelegate.swift

      - name: Set up keychain
        script: keychain initialize

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Show signing profile (push check)
        script: |
          for p in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "== $p"
            security cms -D -i "$p" | plutil -p - | grep -E '"Name"|aps-environment|application-identifier' || true
          done

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || \
                                app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          echo "New build number: $(($LATEST_BUILD_NUMBER + 1))"

      - name: Build IPA
        script: |
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa" \
            --archive-flags="-destination 'generic/platform=iOS'"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=========== XCODEBUILD ERRORS ==========="
            grep -h -B2 -A8 -E "error:|Provisioning profile|entitlement" /tmp/xcodebuild_logs/*.log 2>/dev/null | head -120
            echo "=========================================="
          fi
          exit $STATUS

      - name: Find IPA (debug)
        script: |
          echo "Looking for IPA files..."
          find "$CM_BUILD_DIR" -name "*.ipa" -type f || true
          ls -la "$CM_BUILD_DIR/build/ios/ipa/" || true

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false