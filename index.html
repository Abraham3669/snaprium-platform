<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags – Core for Google & SEO -->
    <title>Snaprium - Instant Step-by-Step Math & Physics Solver</title>
    <meta name="description" content="Snap any math or physics problem and get clear, exam-ready step-by-step solutions in seconds. Master homework, ace exams, and study smarter with Snaprium – your ultimate problem solver.">
    
    <!-- Open Graph / Facebook, WhatsApp, LinkedIn Previews -->
    <meta property="og:title" content="Snaprium - Instant Step-by-Step Math & Physics Solver">
   <meta property="og:description"
      content="Snap a photo of any Math or Physics question and get instant step-by-step solutions.">
    <meta property="og:image" content="https://snaprium.com/assets/images/snaprium-og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://snaprium.com">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Snaprium">
    
    <!-- Twitter/X Cards – Great for shares on X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snaprium - Instant Math & Physics Problem Solver">
    <meta name="twitter:description" content="Snap your question → get step-by-step solutions instantly. Perfect for students tackling math and physics homework and exams.">
    <meta name="twitter:image" content="https://snaprium.com/assets/images/snaprium-og-image.jpg">
    
    <!-- Favicon & App Icons (add these files to /public/) -->
    <link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />



    
    <!-- Preconnect to important domains if you use CDNs/fonts -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
    
    <!-- Noindex if still in dev – remove when live -->
    <!-- <meta name="robots" content="noindex, nofollow" /> -->
  </head>
  <body>
    <div id="root"></div>

    <script>
      window.addEventListener('error', function (e) {
        document.body.innerHTML =
          '<div style="padding:20px;font-family:monospace;font-size:13px;color:#d32f2f;background:#fff;">' +
          '<h2 style="color:#d32f2f;">Script Error</h2>' +
          '<p><strong>' + (e.message || 'Unknown error') + '</strong></p>' +
          '<p>' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '</p>' +
          '<pre style="white-space:pre-wrap;font-size:11px;">' + (e.error && e.error.stack ? e.error.stack : '') + '</pre>' +
          '</div>';
      });

      window.addEventListener('unhandledrejection', function (e) {
        document.body.innerHTML =
          '<div style="padding:20px;font-family:monospace;font-size:13px;color:#d32f2f;background:#fff;">' +
          '<h2 style="color:#d32f2f;">Unhandled Promise Rejection</h2>' +
          '<pre style="white-space:pre-wrap;font-size:11px;">' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>' +
          '</div>';
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
